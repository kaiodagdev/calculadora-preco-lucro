<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Preço e Lucro</title>
</head>
<body>

    <h1>Calculadora de Preço e Lucro</h1>
    <br>
    <label> Custo do produto (R$): </label>
    <input type="number" id="custo">
<br>
    <label> Valor do frete (R$): </label>
    <input type="number" id="frete">
<br> 
    <label> Valor da taxa marketplace (R$): </label>
    <input type="number" id="taxa">
<br>
    <label> Lucro Desejado (%): </label>
    <input type="number" id="lucro">

    <button id="calcular">Calcular</button>
    <p id="resultado"> </p>

    <script>
     document.getElementById("calcular").addEventListener("click",function() {
        const custo = Number(document.getElementById("custo").value);
        const frete = Number(document.getElementById("frete").value);
        const taxa = Number(document.getElementById("taxa").value);
        const lucro = Number(document.getElementById("lucro").value);

        const gastototal = custo + frete + taxa ;
        const preco = gastototal * (1 + lucro / 100);
        const lucroRS = preco - gastototal;

        document.getElementById("resultado").textContent = "Preço ideal: R$ " + preco.toFixed(2) + " | Lucro: R$ " + lucroRS.toFixed(2);
     });

    </script>

</body>
</html>
