<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Preço e Lucro</title>
</head>
<body>

    <h1>Calculadora de Preço e Lucro</h1>
    <br>
    <label> Custo do produto (R$): </label>
    <input type="number" id="custo">
<br>
    <label> Valor do frete (R$): </label>
    <input type="number" id="frete">
<br> 
    <label> Valor da taxa marketplace (R$): </label>
    <input type="number" id="taxa">
<br>
    <label> Lucro Desejado (%): </label>
    <input type="number" id="lucro">

    <button id="calcular">Calcular</button>
    <p id="resultado"> </p>

    <script>
     document.getElementById("calcular").addEventListener("click",function() {
        const campoCusto = document.getElementById("custo").value;
        const campoFrete = document.getElementById("frete").value;
        const campoTaxa =  document.getElementById("taxa").value;
        const campoLucro = document.getElementById("lucro").value;

        if (campoCusto === "" || campoFrete === "" || campoTaxa === "" || campoLucro === "") {
            resultado.textContent = "Preencha todos os campos.";
            return;
        }

        const custo = Number(campoCusto);
        const frete = Number(campoFrete);
        const taxa = Number(campoTaxa);
        const lucro = Number(campoLucro);

        if (custo < 0 || frete < 0 || taxa < 0 || lucro < 0) {
            resultado.textContent = "Use apenas numeros positivos.";
            return;
        }

        if (custo === 0) {
            resultado.textContent = "Custo do produto deve ser maior que 0.";
            return;
        }

        const gastototal = custo + frete + taxa ;
        const preco = gastototal * (1 + lucro / 100);
        const lucroRS = preco - gastototal;

        document.getElementById("resultado").textContent = "Preço ideal: R$ " + preco.toFixed(2) + " | Lucro: R$ " + lucroRS.toFixed(2);
     });

    </script>

</body>
</html>
